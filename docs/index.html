<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unbubble Em Alta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho fixo com abas por fileira; cada fileira é uma grade numerada, como um painel de avaliação. */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --fg: #16181a;
  --muted: #5d6266;
  --line: #e2e2dc;
  --accent: #c8102e;
  --br: #0f7a4a;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111314; --surface: #1a1d1f; --fg: #eceeea; --muted: #9aa1a5;
    --line: #2a2e31; --accent: #ff4d5e; --br: #3ccf8e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111314; --surface: #1a1d1f; --fg: #eceeea; --muted: #9aa1a5;
  --line: #2a2e31; --accent: #ff4d5e; --br: #3ccf8e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 18px 0; border-bottom: 1px solid var(--line);
}
.topo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 {
  font: 800 clamp(24px, 4vw, 34px)/1 var(--display); font-stretch: 112%; margin: 0;
  letter-spacing: -0.01em;
}
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
nav button {
  font: 600 14px var(--body); color: var(--muted); background: none; border: 0;
  border-bottom: 3px solid transparent; padding: 8px 10px 9px; cursor: pointer; white-space: nowrap;
}
nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 1280px; margin: 0 auto; padding-block: 20px 48px; }
.explica { color: var(--muted); max-width: 70ch; margin: 0 0 18px; }
.grade {
  display: grid; gap: 22px 16px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
}
.card { display: grid; gap: 8px; min-width: 0; color: inherit; text-decoration: none; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pos {
  position: absolute; left: 0; top: 0; font: 800 15px/1 var(--display); font-stretch: 100%;
  background: var(--bg); color: var(--fg); padding: 6px 9px 6px 8px; border-bottom-right-radius: 8px;
  font-variant-numeric: tabular-nums;
}
.titulo {
  font-weight: 600; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere;
}
.card:hover .titulo { color: var(--accent); }
.linha { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; }
.linha .canal { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font: 500 12px var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.aviso { padding: 24px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.carregando .titulo { color: var(--muted); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) {
  .thumb img { transition: transform .2s; }
  .card:hover .thumb img { transform: scale(1.03); }
}
</style>
</head>
<body>
<header>
  <div class="topo">
    <h1>Unbubble <span>Em Alta</span></h1>
    <div class="meta" id="meta">Carregando o ranking…</div>
  </div>
  <nav id="abas" role="tablist" aria-label="Fileiras"></nav>
</header>
<main>
  <p class="explica" id="explica"></p>
  <div class="grade" id="grade"></div>
</main>
<script>
const RANKING = "https://raw.githubusercontent.com/bernardomcr/unbubble/dados/ranking.json";
const CATEGORIAS = {
  "1": "Filmes e desenhos", "2": "Automóveis", "10": "Música", "15": "Animais", "17": "Esportes",
  "19": "Viagens e eventos", "20": "Jogos", "22": "Pessoas e blogs", "23": "Comédia",
  "24": "Entretenimento", "25": "Notícias e política", "26": "Tutoriais e estilo",
  "27": "Educação", "28": "Ciência e tecnologia",
};
const fmt = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
const infoCache = new Map();

function fileiras(r) {
  const lista = [
    { id: "em-alta", nome: "Em Alta", itens: r.em_alta, num: x => `score ${x.score.toFixed(2)}`,
      explica: "Ordenado pelo score: views brasileiras por hora, desempenho acima da média do canal e aceleração, com penalidade para vídeos com mais de 48 h. Máximo de 2 por canal." },
    { id: "mais-vistos", nome: "Mais vistos 24 h", itens: r.mais_vistos_24h, num: x => `${fmt.format(x.views_br)} views BR`,
      explica: "Views ganhas nas últimas 24 horas, multiplicadas pelo fator Brasil. Máximo de 2 por canal." },
  ];
  for (const [cat, itens] of Object.entries(r.categorias || {})) {
    lista.push({ id: `cat-${cat}`, nome: CATEGORIAS[cat] || `Categoria ${cat}`, itens,
      num: x => `score ${x.score.toFixed(2)}`,
      explica: `Candidatos da categoria ${CATEGORIAS[cat] || cat}, na ordem do score do Em Alta.` });
  }
  lista.push({ id: "lives", nome: "Lives", itens: r.lives, num: x => `${fmt.format(x.espectadores_br)} assistindo`,
    explica: "Ao vivo agora, por espectadores simultâneos multiplicados pelo fator Brasil." });
  return lista.filter(f => f.itens && f.itens.length);
}

async function info(id) {
  if (!infoCache.has(id)) {
    const url = `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent("https://www.youtube.com/watch?v=" + id)}`;
    infoCache.set(id, fetch(url).then(r => r.ok ? r.json() : null).catch(() => null));
  }
  return infoCache.get(id);
}

function desenhar(f) {
  document.getElementById("explica").textContent = f.explica;
  const grade = document.getElementById("grade");
  grade.replaceChildren(...f.itens.map((x, i) => {
    const a = document.createElement("a");
    a.className = "card carregando";
    a.href = `https://www.youtube.com/watch?v=${x.id}`;
    a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `
      <div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${x.id}/mqdefault.jpg"><span class="pos">${i + 1}</span></div>
      <p class="titulo">Carregando título…</p>
      <div class="linha"><span class="canal"></span><span class="num">${f.num(x)}</span></div>`;
    info(x.id).then(d => {
      a.classList.remove("carregando");
      a.querySelector(".titulo").textContent = d ? d.title : "Título indisponível";
      a.querySelector(".canal").textContent = d ? d.author_name : "";
    });
    return a;
  }));
}

function abrir(lista, id) {
  const f = lista.find(x => x.id === id) || lista[0];
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.id === f.id);
  try { localStorage.setItem("aba", f.id); } catch (e) {}
  desenhar(f);
}

async function iniciar() {
  try {
    const r = await (await fetch(RANKING, { cache: "no-store" })).json();
    const quando = new Date(r.gerado_em);
    const minutos = Math.round((Date.now() - quando) / 60000);
    document.getElementById("meta").textContent =
      `Atualizado ${quando.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })} (há ${minutos} min)`;
    const lista = fileiras(r);
    const abas = document.getElementById("abas");
    abas.replaceChildren(...lista.map(f => {
      const b = document.createElement("button");
      b.role = "tab"; b.dataset.id = f.id;
      b.textContent = `${f.nome} (${f.itens.length})`;
      b.onclick = () => abrir(lista, f.id);
      return b;
    }));
    let salva = null;
    try { salva = localStorage.getItem("aba"); } catch (e) {}
    abrir(lista, salva);
  } catch (e) {
    document.getElementById("meta").textContent = "";
    document.getElementById("grade").innerHTML =
      `<div class="aviso">Não consegui ler o ranking. Verifique a internet e recarregue a página; se continuar, o coletor pode ter falhado na última hora.</div>`;
  }
}
iniciar();
</script>
</body>
</html>
